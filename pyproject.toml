[project]
name = "sea-battle"
version = "0.1.0"
description = "REST service for a networked Battleship game with persistent sessions, pluggable strategies, and a tournament arena."
readme = "README.md"
authors = [
    { name = "Artem Ponomarev" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.0,<2.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.0,<4.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
